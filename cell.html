<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Productos</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 30px 8%;
      background: #f5f5f5;
    }

    h1 { margin: 0 0 25px; }

    /* Cuadrícula: las tarjetas se acomodan solas */
    .productos {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
    }

    /* Cada tarjeta */
    .tarjeta {
      background: white;
      border-radius: 16px;
      padding: 12px;
    }

    .tarjeta img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 12px;
    }

    .tarjeta h3 { margin: 12px 0 4px; font-size: 16px; }
    .tarjeta p { margin: 0; color: #2255dd; }

    /* Link para volver */
    .volver { display: inline-block; margin-bottom: 20px; color: #333; }
  </style>
</head>

<body>

  <a class="volver" href="layout.html">← Volver al inicio</a>
  <h1>Encuentra tu próximo dispositivo</h1>

  <div class="productos">

    <div class="tarjeta">
      <img src="iphone17.avif" alt="Iphone">
      <h3>Iphone 1</h3>
      <p>RD$ 3,400</p>
    </div>

    <div class="tarjeta">
      <img src="errrr.avif" alt="Computadora">
      <h3>Computadora</h3>
      <p>RD$ 4,200</p>
    </div>

    <div class="tarjeta">
      <img src="premium_photo-1679513691485-711d030f7e94.avif" alt="Audífonos">
      <h3>Audífonos</h3>
      <p>RD$ 3,000</p>
    </div>

    <div class="tarjeta">
      <img src="tablet.avif" alt="Tablet">
      <h3>Tablet</h3>
      <p>RD$ 12,000</p>
    </div>

  </div>

</body>
</html>
